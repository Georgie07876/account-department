stages:
  - test
  - build
  - deploy

variables:
  HUSKY: "0"
  NODE_VERSION: "24.22.1"
  PROJECT_BASE_PATH: "/var/www"
  PROJECT_PATH: "$PROJECT_BASE_PATH/$PROJECT_NAME"

include:
  - local: ".gitlab-ci.prod.yml"
    rules:
      - if: '$CI_COMMIT_BRANCH == "master"'

test:
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  before_script:
    - |
      export NVM_DIR="$HOME/.nvm"
      if [ ! -s "$NVM_DIR/nvm.sh" ]; then
        curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
      fi
      . "$NVM_DIR/nvm.sh"
      nvm install "$NODE_VERSION"
      nvm use "$NODE_VERSION"
      node -v
      npm -v
  script:
    - npm ci
    - npm run lint
    - npm run format:check
    - npm run generate

smoke:shell-lxc:
  stage: test
  tags: ["production"]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - shell-lxc -N "$PROXMOX_NODE" -H "$CT_HOST" "hostname; docker ps --format '{{.Names}}'"

build:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  tags:
    - production
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker image build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" -f deploy/Dockerfile .
    - docker image push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker image push "$CI_REGISTRY_IMAGE:latest"
