deploy:
  stage: deploy
  needs: [build]
  tags: ["production"]
  environment:
    name: production
    url: https://kafedra-bu.rsue.ru/
  script:
    - shell-lxc -N "$PROXMOX_NODE" -H "$CT_HOST" "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - shell-lxc -N "$PROXMOX_NODE" -H "$CT_HOST" "docker compose --project-directory $PROJECT_PATH pull web"
    - shell-lxc -N "$PROXMOX_NODE" -H "$CT_HOST" "docker compose --project-directory $PROJECT_PATH up -d web"
    - shell-lxc -N "$PROXMOX_NODE" -H "$CT_HOST" "docker inspect --format '{{.Image}}' \$(docker compose --project-directory $PROJECT_PATH ps -q web)"
    - sleep 3
    - curl -fsS -o /dev/null -w 'root: %{http_code}\n' https://kafedra-bu.rsue.ru/
    - curl -fsS -o /dev/null -w 'deep: %{http_code}\n' https://kafedra-bu.rsue.ru/programs/master-1/
