# Dev-окружение монорепо. Прод-деплой пока живёт в deploy/docker-compose.yml
# и будет переработан на фазе 5 (см. PLAN.md).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-account_department}
      POSTGRES_USER: ${POSTGRES_USER:-account_department}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
